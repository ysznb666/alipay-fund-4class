name: 四大类基金组合周更

# 每周六 01:00 UTC = 北京时间 09:00（与 md 里的口径一致）
on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:          # 支持手动触发，便于首次验证

# 写回周更结果，并在同一任务中直接发布 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 只依赖标准库，无需 pip install；缓存净值序列，减少对东财的请求
      - uses: actions/cache@v4
        with:
          path: work/qdii2026/cache
          key: qdii-nav-cache-${{ github.run_id }}
          restore-keys: |
            qdii-nav-cache-

      # 抓取失败也不让整条流水线挂掉：此时沿用仓库里已提交的 deploy_site（上一版），
      # 线上站点保持可用，只在 Actions 里报一个 warning。
      - name: 跑周更流水线
        id: pipeline
        continue-on-error: true
        run: |
          python -c "import sys;print(sys.version)"
          python run_weekly.py
        env:
          PYTHONIOENCODING: utf-8
          # 每周强制全量刷新，防止旧缓存让数据日期停滞
          QDII_REFRESH_ALL: '1'

      - name: 兜底（流水线失败时沿用上一版）
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "::warning::周更流水线未成功（多为境外出口访问东财受限），本次沿用仓库内 deploy_site 的上一版页面。"

      - name: 自检（图表 / 关键区块 / 无残留 token）
        continue-on-error: true
        run: python scripts/verify_page.py deploy_site/index.html

      # 把新页面回写仓库：① 留档 ② 触发 GitHub Pages 自动发布 ③ 下次兜底用的就是它
      # 注意：.gitignore 把 work/qdii2026/*.json 排除了，所以 swap_state.json 必须用 -f 强制加入，
      #       否则 `git add` 会因「路径被忽略」直接以退出码 1 失败。
      - name: 提交发布包
        if: steps.pipeline.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A deploy_site outputs/final
          git add -f work/qdii2026/swap_state.json
          git diff --cached --quiet || git commit -m "chore: 周更发布包 $(date -u +%Y-%m-%d)"
          git push

      - name: Configure GitHub Pages
        if: steps.pipeline.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pipeline.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy_site

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.pipeline.outcome == 'success'
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-and-data
          path: |
            outputs/final/*.html
            work/qdii2026/*.json
          retention-days: 30
